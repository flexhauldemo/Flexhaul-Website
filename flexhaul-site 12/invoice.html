<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Invoice | FlexHaul & Demolition</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="images/favicon-64.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
:root{
  --asphalt:#15130f; --amber:#f5a300; --amber-bright:#ffb81c; --rust:#c9590d;
  --concrete:#ede7d9; --off-white:#f8f5ee; --steel:#6f6a5e; --ink:#1c1812; --good:#4b7d4a;
  --font-display:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--concrete); color:var(--ink); font-family:var(--font-body); min-height:100vh; }
.wrap{ max-width:560px; margin:0 auto; padding:24px 20px 60px; }
.brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:28px; }
.brand img{ height:40px; }
.brand span{ font-family:var(--font-display); font-weight:700; font-size:1.1rem; }
h1{ font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.5rem; text-align:center; margin:0 0 6px; }
.sub{ text-align:center; color:var(--steel); margin-bottom:24px; }
.card{ background:var(--off-white); border-radius:14px; padding:26px; box-shadow:0 20px 50px -25px rgba(0,0,0,0.3); }
.badge{ display:inline-block; font-family:var(--font-mono); font-size:0.75rem; font-weight:700; text-transform:uppercase; padding:4px 12px; border-radius:999px; margin-bottom:16px; }
.badge-unpaid{ background:rgba(201,89,13,0.12); color:var(--rust); }
.badge-paid{ background:rgba(75,125,74,0.15); color:var(--good); }
.badge-overdue{ background:rgba(201,89,13,0.18); color:var(--rust); }
.line-item{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(28,24,18,0.08); font-size:0.95rem; }
.line-item .label{ flex:1; padding-right:12px; }
.line-item .amt{ font-family:var(--font-mono); font-weight:700; white-space:nowrap; }
.total-row{ display:flex; justify-content:space-between; padding-top:16px; margin-top:6px; font-family:var(--font-display); font-weight:700; font-size:1.3rem; text-transform:uppercase; }
.total-row .amt{ color:var(--rust); font-family:var(--font-mono); }
.meta-row{ display:flex; justify-content:space-between; font-size:0.85rem; color:var(--steel); margin-bottom:4px; }
.btn{ display:block; width:100%; text-align:center; padding:16px; border-radius:10px; border:none; cursor:pointer;
  font-family:var(--font-display); font-weight:700; font-size:1.05rem; text-transform:uppercase; letter-spacing:0.02em; margin-top:24px; text-decoration:none; }
.btn-pay{ background:linear-gradient(180deg, var(--amber-bright), var(--amber)); color:var(--ink); }
.btn-pay:disabled{ opacity:0.6; cursor:default; }
.status-banner{ text-align:center; padding:14px; border-radius:10px; font-weight:600; margin-top:20px; font-size:0.92rem; }
.status-paid{ background:rgba(75,125,74,0.15); color:var(--good); }
.status-error{ background:rgba(201,89,13,0.12); color:var(--rust); }
.loading, .not-found{ text-align:center; color:var(--steel); padding:60px 20px; font-family:var(--font-mono); }
.footer{ text-align:center; color:var(--steel); font-size:0.85rem; margin-top:28px; }
.footer a{ color:var(--rust); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="images/logo-icon.png" alt="FlexHaul">
    <span>FlexHaul &amp; Demolition</span>
  </div>

  <div id="loadingState" class="loading">Loading your invoice\u2026</div>
  <div id="notFoundState" class="not-found" style="display:none;">This link isn't valid, or the invoice may have been removed. Call or text us at (765) 885-6317 and we'll sort it out.</div>

  <div id="content" style="display:none;">
    <h1>Your Invoice</h1>
    <p class="sub" id="customerName"></p>

    <div class="card">
      <span class="badge" id="statusBadge"></span>
      <div class="meta-row"><span>Service address</span><span id="jobAddress"></span></div>
      <div class="meta-row" id="dueDateRow" style="margin-bottom:14px;"><span>Due</span><span id="dueDate"></span></div>
      <div id="lineItems"></div>
      <div class="total-row"><span>Total</span><span class="amt" id="totalAmt"></span></div>
    </div>

    <button class="btn btn-pay" id="payBtn" style="display:none;">Pay Now</button>
    <div id="statusBanner" style="display:none;"></div>

    <p class="footer">Questions? Call or text <a href="tel:+17658856317">(765) 885-6317</a></p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API_BASE = "https://flexhaul-crm-backend.onrender.com/api";
  var params = new URLSearchParams(window.location.search);
  var token = params.get("token");
  var justPaid = params.get("paid") === "1";

  var loadingState = document.getElementById("loadingState");
  var notFoundState = document.getElementById("notFoundState");
  var content = document.getElementById("content");

  if (!token) {
    loadingState.style.display = "none";
    notFoundState.style.display = "block";
  } else {
    loadInvoice();
  }

  function money(n){
    return "$" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function esc(s){
    if (s === undefined || s === null) return "";
    return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }
  function fmtDate(d){
    if (!d) return "\u2014";
    try { return new Date(d + "T00:00:00").toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }); }
    catch(e){ return d; }
  }

  function loadInvoice(){
    fetch(API_BASE + "/public/invoices/" + encodeURIComponent(token))
      .then(function(res){
        if (!res.ok) throw new Error("not found");
        return res.json();
      })
      .then(function(data){
        renderInvoice(data.invoice, data.payments_enabled);
      })
      .catch(function(){
        loadingState.style.display = "none";
        notFoundState.style.display = "block";
      });
  }

  function renderInvoice(invoice, paymentsEnabled){
    loadingState.style.display = "none";
    content.style.display = "block";

    document.getElementById("customerName").textContent = "Billed to " + invoice.customer_name;
    document.getElementById("jobAddress").textContent = invoice.job_address || "\u2014";
    document.getElementById("totalAmt").textContent = money(invoice.amount);

    var badge = document.getElementById("statusBadge");
    var effectiveStatus = invoice.status;
    if (justPaid && invoice.status !== "paid") effectiveStatus = "paid"; // optimistic, confirmed by backend on next load anyway
    badge.textContent = effectiveStatus.toUpperCase();
    badge.className = "badge badge-" + effectiveStatus;

    if (invoice.due_date && invoice.status !== "paid") {
      document.getElementById("dueDate").textContent = fmtDate(invoice.due_date);
    } else {
      document.getElementById("dueDateRow").style.display = "none";
    }

    var wrap = document.getElementById("lineItems");
    wrap.innerHTML = invoice.line_items.map(function(item){
      return '<div class="line-item"><span class="label">' + esc(item.label) +
             (item.qty > 1 ? ' <span style="color:var(--steel);">\u00d7' + item.qty + '</span>' : '') +
             '</span><span class="amt">' + money(item.amount) + '</span></div>';
    }).join("");

    var payBtn = document.getElementById("payBtn");
    var banner = document.getElementById("statusBanner");

    if (invoice.status === "paid" || justPaid) {
      banner.style.display = "block";
      banner.className = "status-banner status-paid";
      banner.textContent = "\u2713 This invoice has been paid. Thank you!";
      return;
    }

    if (!paymentsEnabled) {
      banner.style.display = "block";
      banner.className = "status-banner status-error";
      banner.textContent = "Online payment isn't available yet \u2014 please call or text us to pay.";
      return;
    }

    payBtn.style.display = "block";
    payBtn.addEventListener("click", function(){
      payBtn.disabled = true;
      payBtn.textContent = "Redirecting to secure payment\u2026";

      fetch(API_BASE + "/public/invoices/" + encodeURIComponent(token) + "/pay-link", { method: "POST" })
        .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
        .then(function(result){
          if (!result.ok || !result.data.url) throw new Error(result.data.error || "Could not start payment");
          window.location.href = result.data.url;
        })
        .catch(function(err){
          payBtn.disabled = false;
          payBtn.textContent = "Pay Now";
          banner.style.display = "block";
          banner.className = "status-banner status-error";
          banner.textContent = err.message || "Something went wrong. Please call or text us to pay.";
        });
    });
  }
})();
</script>
</body>
</html>
