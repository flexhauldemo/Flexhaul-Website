<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Estimate | FlexHaul & Demolition</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="images/favicon-64.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
:root{
  --asphalt:#15130f; --amber:#f5a300; --amber-bright:#ffb81c; --rust:#c9590d;
  --concrete:#ede7d9; --off-white:#f8f5ee; --steel:#6f6a5e; --ink:#1c1812; --good:#4b7d4a;
  --font-display:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--concrete); color:var(--ink); font-family:var(--font-body); min-height:100vh; }
.wrap{ max-width:560px; margin:0 auto; padding:24px 20px 60px; }
.brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:28px; }
.brand img{ height:40px; }
.brand span{ font-family:var(--font-display); font-weight:700; font-size:1.1rem; }
h1{ font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.5rem; text-align:center; margin:0 0 6px; }
.sub{ text-align:center; color:var(--steel); margin-bottom:24px; }
.card{ background:var(--off-white); border-radius:14px; padding:26px; box-shadow:0 20px 50px -25px rgba(0,0,0,0.3); }
.line-item{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(28,24,18,0.08); font-size:0.95rem; }
.line-item .label{ flex:1; padding-right:12px; }
.line-item .amt{ font-family:var(--font-mono); font-weight:700; white-space:nowrap; }
.total-row{ display:flex; justify-content:space-between; padding-top:16px; margin-top:6px; font-family:var(--font-display); font-weight:700; font-size:1.3rem; text-transform:uppercase; }
.total-row .amt{ color:var(--rust); font-family:var(--font-mono); }
.btn{ display:block; width:100%; text-align:center; padding:16px; border-radius:10px; border:none; cursor:pointer;
  font-family:var(--font-display); font-weight:700; font-size:1.05rem; text-transform:uppercase; letter-spacing:0.02em; margin-top:24px; }
.btn-approve{ background:linear-gradient(180deg, var(--amber-bright), var(--amber)); color:var(--ink); }
.btn-approve:disabled{ opacity:0.6; cursor:default; }
.status-banner{ text-align:center; padding:14px; border-radius:10px; font-weight:600; margin-top:20px; }
.status-approved{ background:rgba(75,125,74,0.15); color:var(--good); }
.status-error{ background:rgba(201,89,13,0.12); color:var(--rust); }
.loading, .not-found{ text-align:center; color:var(--steel); padding:60px 20px; font-family:var(--font-mono); }
.footer{ text-align:center; color:var(--steel); font-size:0.85rem; margin-top:28px; }
.footer a{ color:var(--rust); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="images/logo-icon.png" alt="FlexHaul">
    <span>FlexHaul &amp; Demolition</span>
  </div>

  <div id="loadingState" class="loading">Loading your estimate\u2026</div>
  <div id="notFoundState" class="not-found" style="display:none;">This link isn't valid, or the estimate may have been removed. Call or text us at (765) 885-6317 and we'll sort it out.</div>

  <div id="content" style="display:none;">
    <h1>Your Estimate</h1>
    <p class="sub" id="customerName"></p>

    <div class="card">
      <div id="lineItems"></div>
      <div class="total-row"><span>Total</span><span class="amt" id="totalAmt"></span></div>
    </div>

    <button class="btn btn-approve" id="approveBtn">Approve This Estimate</button>
    <div id="statusBanner" style="display:none;"></div>

    <p class="footer">Questions? Call or text <a href="tel:+17658856317">(765) 885-6317</a></p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API_BASE = "https://flexhaul-crm-backend.onrender.com/api";
  var params = new URLSearchParams(window.location.search);
  var token = params.get("token");

  var loadingState = document.getElementById("loadingState");
  var notFoundState = document.getElementById("notFoundState");
  var content = document.getElementById("content");

  if (!token) {
    loadingState.style.display = "none";
    notFoundState.style.display = "block";
  } else {
    loadEstimate();
  }

  function money(n){
    return "$" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function esc(s){
    if (s === undefined || s === null) return "";
    return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }

  function loadEstimate(){
    fetch(API_BASE + "/public/estimates/" + encodeURIComponent(token))
      .then(function(res){
        if (!res.ok) throw new Error("not found");
        return res.json();
      })
      .then(function(data){
        renderEstimate(data.estimate);
      })
      .catch(function(){
        loadingState.style.display = "none";
        notFoundState.style.display = "block";
      });
  }

  function renderEstimate(estimate){
    loadingState.style.display = "none";
    content.style.display = "block";

    document.getElementById("customerName").textContent = "Prepared for " + estimate.customer_name;
    document.getElementById("totalAmt").textContent = money(estimate.total);

    var wrap = document.getElementById("lineItems");
    wrap.innerHTML = estimate.line_items.map(function(item){
      return '<div class="line-item"><span class="label">' + esc(item.label) +
             (item.qty > 1 ? ' <span style="color:var(--steel);">\u00d7' + item.qty + '</span>' : '') +
             '</span><span class="amt">' + money(item.amount) + '</span></div>';
    }).join("");

    var approveBtn = document.getElementById("approveBtn");
    var banner = document.getElementById("statusBanner");

    if (estimate.accepted) {
      approveBtn.style.display = "none";
      banner.style.display = "block";
      banner.className = "status-banner status-approved";
      banner.textContent = "\u2713 This estimate has already been approved. We'll be in touch to confirm your appointment.";
      return;
    }

    approveBtn.addEventListener("click", function(){
      if (!confirm("Approve this estimate for " + money(estimate.total) + "? We'll reach out to schedule your appointment.")) return;
      approveBtn.disabled = true;
      approveBtn.textContent = "Approving\u2026";

      fetch(API_BASE + "/public/estimates/" + encodeURIComponent(token) + "/approve", { method: "POST" })
        .then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
        .then(function(result){
          if (!result.ok) throw new Error(result.data.error || "Something went wrong");
          approveBtn.style.display = "none";
          banner.style.display = "block";
          banner.className = "status-banner status-approved";
          banner.textContent = "\u2713 Approved! We'll text or call you shortly to confirm your appointment time.";
        })
        .catch(function(err){
          approveBtn.disabled = false;
          approveBtn.textContent = "Approve This Estimate";
          banner.style.display = "block";
          banner.className = "status-banner status-error";
          banner.textContent = err.message || "Something went wrong. Please call or text us instead.";
        });
    });
  }
})();
</script>
</body>
</html>
